name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "invalid release tag: $env:RELEASE_TAG"
            exit 1
          }
          $packageVersion = node -p 'require("./package.json").version'
          $expectedTag = "v$packageVersion"
          if ($expectedTag -ne $env:RELEASE_TAG) {
            Write-Error (
              "Tag $env:RELEASE_TAG does not match " +
              "package.json version $packageVersion"
            )
            exit 1
          }
          $tagsAtHead = git tag --points-at HEAD
          if (-not ($tagsAtHead -split "`r?`n" |
              Where-Object { $_ -eq $env:RELEASE_TAG })) {
            Write-Error "Tag $env:RELEASE_TAG not found at HEAD"
            exit 1
          }

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Provenance/Sigstore Fulcio TLS fails on this self-hosted Windows
      # runner (CA_CREATE_SIGNING_CERTIFICATE_ERROR).
      - run: npm publish --access public

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:RELEASE_TAG"
          --verify-tag
          --generate-notes
          --title "pi-agent-plugins $env:RELEASE_TAG"
